name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # The app is Windows Forms, so it builds on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StarbucksPOS.slnx

      - name: Build
        run: dotnet build StarbucksPOS.slnx --no-restore --configuration Release

      # The tests that need SQL Server LocalDB skip themselves when it is
      # not available on the machine; every other test always runs.
      - name: Test
        run: dotnet test StarbucksPOS.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
